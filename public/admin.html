
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-1 Frankie | Admin Orders</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #17120e;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h2 {
      color: #ffb900;
    }

    button {
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .refresh-btn {
      background: #ffb900;
      color: #17120e;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000010;
    }

    .stat-card h3 {
      font-size: 14px;
      color: #777;
      margin-bottom: 8px;
    }

    .stat-card p {
      font-size: 25px;
      font-weight: bold;
    }

    .date-filter {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      background: white;
      padding: 15px;
      border-radius: 10px;
    }

    .date-filter label {
      font-weight: bold;
    }

    .date-filter input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .date-btn {
      background: #17120e;
      color: white;
    }

    .all-btn {
      background: #ffb900;
      color: #17120e;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .filter-btn {
      background: white;
      border: 1px solid #ddd;
    }

    .filter-btn.active {
      background: #17120e;
      color: white;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000010;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .order-id {
      font-weight: bold;
    }

    .status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .Pending {
      background: #fff3cd;
      color: #856404;
    }

    .Done, .Delivered {
      background: #d4edda;
      color: #155724;
    }

    .Rejected, .Cancelled {
      background: #f8d7da;
      color: #721c24;
    }

    .Accepted, .Preparing, .Out-for-Delivery {
      background: #d1ecf1;
      color: #0c5460;
    }

    .order-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }

    .detail p {
      margin-bottom: 6px;
      font-size: 14px;
      word-break: break-word;
    }

    .items {
      background: #f8f8f8;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .items h4 {
      margin-bottom: 10px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .order-total {
      font-size: 20px;
      font-weight: bold;
      text-align: right;
      margin-bottom: 15px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .accept-btn {
      background: #198754;
      color: white;
    }

    .reject-btn {
      background: #dc3545;
      color: white;
    }

    .empty, .loading {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px;
      }

      .container {
        padding: 12px;
      }

      .order-card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>A-1 Frankie Admin</h2>
    <button class="refresh-btn" id="refreshBtn">Refresh Orders</button>
  </header>

  <main class="container">

    <!-- Stats -->
    <section class="stats">
      <div class="stat-card">
        <h3>Total Orders</h3>
        <p id="totalOrders">0</p>
      </div>

      <div class="stat-card">
        <h3>Pending Orders</h3>
        <p id="pendingOrders">0</p>
      </div>

      <div class="stat-card">
        <h3>Done Orders</h3>
        <p id="doneOrders">0</p>
      </div>

      <div class="stat-card">
        <h3>Rejected Orders</h3>
        <p id="rejectedOrders">0</p>
      </div>
    </section>

    <!-- Date Filter -->
    <section class="date-filter">
      <label for="orderDate">Filter Orders By Date:</label>

      <input type="date" id="orderDate">

      <button id="filterDate" class="date-btn">Search</button>

      <button id="allDates" class="all-btn">All Dates</button>
    </section>

    <!-- Status Filter -->
    <section class="filters">
      <button class="filter-btn active" data-status="All">All</button>
      <button class="filter-btn" data-status="Pending">Pending</button>
      <button class="filter-btn" data-status="Done">Done</button>
      <button class="filter-btn" data-status="Rejected">Rejected</button>
    </section>

    <!-- Orders -->
    <section class="orders" id="ordersContainer">
      <div class="loading">Loading orders...</div>
    </section>

  </main>

  <script>
    const API_ORDERS = "/api/orders";

    let allOrders = [];
    let currentFilter = "All";

    const $ = (id) => document.getElementById(id);

    // Load orders from backend
    async function loadOrders(date = "") {
      try {
        $("ordersContainer").innerHTML =
          '<div class="loading">Loading orders...</div>';

        let url = API_ORDERS;

        if (date) {
          url += `?date=${encodeURIComponent(date)}`;
        }

        const response = await fetch(url);
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Unable to fetch orders");
        }

        allOrders = result.data || [];

        updateStats();
        renderOrders();

      } catch (error) {
        console.error("Load Orders Error:", error);

        $("ordersContainer").innerHTML =
          '<div class="empty">Unable to load orders. Please try again.</div>';
      }
    }

    // Update statistics
    function updateStats() {
      $("totalOrders").textContent = allOrders.length;

      $("pendingOrders").textContent =
        allOrders.filter(order => order.status === "Pending").length;

      $("doneOrders").textContent =
        allOrders.filter(order => order.status === "Done").length;

      $("rejectedOrders").textContent =
        allOrders.filter(order => order.status === "Rejected").length;
    }

    // Render orders
    function renderOrders() {
      const container = $("ordersContainer");

      let filteredOrders = allOrders;

      if (currentFilter !== "All") {
        filteredOrders = allOrders.filter(
          order => order.status === currentFilter
        );
      }

      if (!filteredOrders.length) {
        container.innerHTML =
          '<div class="empty">No orders found.</div>';
        return;
      }

      container.innerHTML = filteredOrders.map(order => {
        const orderDate = new Date(order.createdAt).toLocaleString("en-IN");

        const itemsHTML = (order.items || []).map(item => `
          <div class="item-row">
            <span>
              ${escapeHTML(item.productName)} × ${item.quantity}
            </span>
            <strong>₹${Number(item.itemTotal || 0).toFixed(2)}</strong>
          </div>
        `).join("");

        const statusClass = order.status.replaceAll(" ", "-");

        return `
          <article class="order-card">

            <div class="order-header">
              <div>
                <p class="order-id">Order #${escapeHTML(order._id.slice(-8))}</p>
                <small>${orderDate}</small>
              </div>

              <span class="status ${statusClass}">
                ${escapeHTML(order.status)}
              </span>
            </div>

            <div class="order-details">

              <div class="detail">
                <p><strong>Customer:</strong> ${escapeHTML(order.customerName)}</p>
                <p><strong>Phone:</strong> ${escapeHTML(order.phone)}</p>
              </div>

              <div class="detail">
                <p><strong>Address:</strong>
                  ${escapeHTML(order.location?.address || "Not available")}
                </p>
                <p><strong>Distance:</strong>
                  ${Number(order.distanceKm || 0).toFixed(2)} KM
                </p>
              </div>

              <div class="detail">
                <p><strong>Note:</strong>
                  ${escapeHTML(order.note || "No note")}
                </p>
              </div>

            </div>

            <div class="items">
              <h4>Order Items</h4>
              ${itemsHTML}
            </div>

            <div class="order-total">
              Total: ₹${Number(order.total || 0).toFixed(2)}
            </div>

            ${
              order.status === "Pending"
                ? `
                  <div class="actions">
                    <button
                      class="accept-btn"
                      onclick="updateStatus('${order._id}', 'Done')"
                    >
                      Accept
                    </button>

                    <button
                      class="reject-btn"
                      onclick="updateStatus('${order._id}', 'Rejected')"
                    >
                      Reject
                    </button>
                  </div>
                `
                : ""
            }

          </article>
        `;
      }).join("");
    }

    // Escape HTML
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    // Update order status
    async function updateStatus(orderId, status) {
      const confirmed = confirm(
        `Are you sure you want to mark this order as ${status}?`
      );

      if (!confirmed) return;

      try {
        const response = await fetch(
          `${API_ORDERS}/${orderId}/status`,
          {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ status })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Status update failed");
        }

        alert(result.message || `Order ${status} successfully`);

        // Reload currently selected date
        await loadOrders($("orderDate").value);

      } catch (error) {
        console.error("Update Status Error:", error);
        alert(error.message || "Unable to update order status.");
      }
    }

    // Status filter buttons
    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");

        currentFilter = button.dataset.status;
        renderOrders();
      });
    });

    // Search selected date
    $("filterDate").addEventListener("click", () => {
      const date = $("orderDate").value;

      if (!date) {
        alert("Please select a date.");
        return;
      }

      loadOrders(date);
    });

    // All dates - fetch all orders
    $("allDates").addEventListener("click", () => {
      $("orderDate").value = "";
      loadOrders();
    });

    // Refresh current date filter
    $("refreshBtn").addEventListener("click", () => {
      loadOrders($("orderDate").value);
    });

    // Initial load - all orders
    loadOrders();

  </script>

</body>
</html>
